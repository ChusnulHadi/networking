[Definition]
# Match IP yang trigger limit_conn / limit_req di nginx, dan koneksi yang timeout saat baca header.
# Requires nginx dikonfigurasi dengan limit_conn_zone dan/atau limit_req_zone.
# Contoh nginx config:
#   limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
#   limit_conn conn_limit 20;
#   limit_req_zone $binary_remote_addr zone=req_limit:10m rate=30r/s;
#   limit_req zone=req_limit burst=10 nodelay;
failregex = ^ \[error\] \d+#\d+: \*\d+ limiting requests, excess: [\d.]+ by zone "[^"]+", client: <HOST>,
            ^ \[error\] \d+#\d+: \*\d+ limiting connections by zone "[^"]+", client: <HOST>,
            ^ \[info\] \d+#\d+: \*\d+ client timed out \(\d+: [^)]+\) while reading client request headers, client: <HOST>,

ignoreregex =
