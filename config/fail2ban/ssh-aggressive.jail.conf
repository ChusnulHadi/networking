# Description
# Attackers typically perform attempts at specific intervals.
# Fail2ban will ban IP addresses with repeated login attempts, but it remains relevant for humans who might forget their passwords.

[sshd-aggressive]
enabled = true
port = ssh
filter = sshd
logpath = /var/log/auth.log
maxretry = 15
findtime = 86400
bantime = 604800
action = iptables-multiport
# Sshd dan sshd-aggressive share filter yang sama — IP yang gagal login bisa kena count di kedua jail
# Tambahkan management IP di sini, contoh: ignoreip = 127.0.0.1/8 ::1 10.0.0.0/24
ignoreip = 127.0.0.1/8 ::1
