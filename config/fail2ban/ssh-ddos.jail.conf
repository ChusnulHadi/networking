# Description
# The attacker tries to make repeated connections for one minute.
# This fail2ban config will ban attacker who trying repeat connection 10x in a minute.

[sshd-ddos]
enabled = true
port = ssh
filter = ssh-ddos.filter
logpath = /var/log/auth.log
maxretry = 10
findtime = 60
bantime = 86400
action = iptables-multiport
# Tambahkan management IP di sini, contoh: ignoreip = 127.0.0.1/8 ::1 10.0.0.0/24
ignoreip = 127.0.0.1/8 ::1
