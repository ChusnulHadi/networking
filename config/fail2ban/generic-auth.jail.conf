# Description
# Template jail untuk service yang di-expose via port forward (umumnya dari container).
# Salin file ini, rename sesuai service, lalu isi port dan logpath.
#
# Contoh penggunaan:
#   cp generic-auth.jail.conf postgresql.jail.conf
#   -> set port    = 5432
#   -> set logpath = /var/log/postgresql/postgresql-*.log
#
#   cp generic-auth.jail.conf mysql.jail.conf
#   -> set port    = 3306
#   -> set logpath = /var/log/mysql/error.log
#
#   cp generic-auth.jail.conf mongodb.jail.conf
#   -> set port    = 27017
#   -> set logpath = /var/log/mongodb/mongod.log
#
#   cp generic-auth.jail.conf redis.jail.conf
#   -> set port    = 6379
#   -> set logpath = /var/log/redis/redis-server.log
#
# Kalau ada beberapa service sekaligus, port bisa digabung dan logpath bisa multiple:
#   port    = 5432,3306
#   logpath = /var/log/postgresql/postgresql-*.log
#             /var/log/mysql/error.log

[generic-auth]
enabled  = true
port     = FILL_IN_PORT
filter   = generic-auth.filter
logpath  = FILL_IN_LOGPATH
maxretry = 3
findtime = 60
bantime  = 604800
action   = iptables-multiport
# Tambahkan management IP di sini, contoh: ignoreip = 127.0.0.1/8 ::1 10.0.0.0/24
ignoreip = 127.0.0.1/8 ::1
