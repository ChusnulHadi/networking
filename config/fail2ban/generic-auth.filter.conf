[Definition]
# Generic filter untuk failed authentication attempts.
# Cocok untuk service yang log-nya mengandung IP + kata kunci gagal login.
# Dipakai bersama generic-auth.jail.conf — user mengisi port dan logpath.
#
# Pattern ini cover log dari:
#   PostgreSQL : FATAL: password authentication failed ... 1.2.3.4
#   MySQL      : Access denied for user 'x'@'1.2.3.4'
#   MongoDB    : Authentication failed ... "remote":"1.2.3.4:port"
#   Redis      : Wrong AUTH password ... client: 1.2.3.4:port

failregex = ^.*[Ff]ailed.*[Aa]uth.*<HOST>.*$
            ^.*[Aa]uth.*[Ff]ailed.*<HOST>.*$
            ^.*[Aa]ccess [Dd]enied.*<HOST>.*$
            ^.*[Ww]rong.*[Pp]assword.*<HOST>.*$
            ^.*[Ii]nvalid.*[Pp]assword.*<HOST>.*$
            ^.*<HOST>.*[Ff]ailed.*[Aa]uth.*$
            ^.*<HOST>.*[Aa]ccess [Dd]enied.*$

ignoreregex =
