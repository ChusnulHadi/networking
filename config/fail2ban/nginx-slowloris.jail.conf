# Description
# Deteksi dan ban IP yang melakukan Slowloris attack — membuka banyak koneksi
# dan mengirim header HTTP sangat lambat untuk exhausted connection pool nginx.
# Jail ini membaca dari nginx error.log dan mendeteksi:
#   - IP yang trigger limit_conn / limit_req
#   - IP yang timeout saat kirim request header

[nginx-slowloris]
enabled  = true
port     = http,https
filter   = nginx-slowloris.filter
logpath  = /var/log/nginx/error.log
maxretry = 10
findtime = 60
bantime  = 86400
action   = iptables-multiport
# Tambahkan management IP di sini, contoh: ignoreip = 127.0.0.1/8 ::1 10.0.0.0/24
ignoreip = 127.0.0.1/8 ::1
