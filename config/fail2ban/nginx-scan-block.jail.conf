[nginx-scan-block]
enabled  = true
port     = http,https
filter   = nginx-scan-block.filter

backend  = auto
logpath  = /var/log/nginx/access.log

# from docker container with compose logging options
# backend = systemd
# journalmatch = SYSLOG_IDENTIFIER=nginx

maxretry = 20
findtime = 60
bantime  = 86400
action   = iptables-multiport
# Tambahkan management IP di sini, contoh: ignoreip = 127.0.0.1/8 ::1 10.0.0.0/24
ignoreip = 127.0.0.1/8 ::1
