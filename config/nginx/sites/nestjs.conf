# ============================================================
# NestJS Reverse Proxy
# Lokasi: /etc/nginx/sites-available/your-app.conf
# Symlink: ln -s /etc/nginx/sites-available/your-app.conf /etc/nginx/sites-enabled/
#
# Asumsi:
#   - NestJS berjalan di localhost:3000
#   - Sertifikat SSL sudah tersedia (e.g., via Certbot)
#   - limit-zones.conf sudah di-include di http{} block
# ============================================================

# Redirect HTTP ke HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name your-domain.com;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name your-domain.com;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/nginx/common/http.server.ssl.conf;

    # Security headers
    include /etc/nginx/common/http.server.security-headers.conf;

    # Limit concurrent connections per IP
    limit_conn conn_limit 20;

    # Log
    access_log /var/log/nginx/nestjs-access.log;
    error_log  /var/log/nginx/nestjs-error.log;

    # Batasi ukuran body request
    client_max_body_size 10M;

    # API routes — rate limit ketat
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        include /etc/nginx/common/http.location.proxy-params.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    # WebSocket (jika NestJS pakai Socket.IO / WS)
    location /socket.io/ {
        limit_conn conn_limit 10;

        include /etc/nginx/common/http.location.proxy-params.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    # Semua route lainnya
    location / {
        limit_req zone=req_limit burst=50 nodelay;
        limit_req_status 429;

        include /etc/nginx/common/http.location.proxy-params.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
