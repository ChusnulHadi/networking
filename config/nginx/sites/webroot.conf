# ============================================================
# Static Webroot
# Lokasi: /etc/nginx/sites-available/your-site.conf
# Symlink: ln -s /etc/nginx/sites-available/your-site.conf /etc/nginx/sites-enabled/
#
# Asumsi:
#   - File statis berada di /var/www/your-site
#   - Sertifikat SSL sudah tersedia (e.g., via Certbot)
#   - limit-zones.conf sudah di-include di http{} block
# ============================================================

# Redirect HTTP ke HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name your-domain.com;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name your-domain.com;

    root  /var/www/your-site;
    index index.html index.htm;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/nginx/common/http.server.ssl.conf;

    # Security headers
    include /etc/nginx/common/http.server.security-headers.conf;

    # Limit concurrent connections per IP
    limit_conn conn_limit 20;

    # Log
    access_log /var/log/nginx/webroot-access.log;
    error_log  /var/log/nginx/webroot-error.log;

    # Static assets — cache agresif
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        access_log  off;
    }

    # Semua request HTML
    location / {
        limit_req zone=req_limit burst=30 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ =404;
    }

    # Blokir akses ke file sensitif
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        return 404;
    }
}
