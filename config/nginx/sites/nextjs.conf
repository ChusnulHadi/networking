# ============================================================
# Next.js Reverse Proxy (SSR + Static Assets)
# Lokasi: /etc/nginx/sites-available/your-app.conf
# Symlink: ln -s /etc/nginx/sites-available/your-app.conf /etc/nginx/sites-enabled/
#
# Asumsi:
#   - Next.js berjalan di localhost:3000
#   - Sertifikat SSL sudah tersedia (e.g., via Certbot)
#   - limit-zones.conf sudah di-include di http{} block
# ============================================================

# Redirect HTTP ke HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name your-domain.com;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name your-domain.com;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/nginx/common/http.server.ssl.conf;

    # Security headers
    include /etc/nginx/common/http.server.security-headers.conf;

    # Limit concurrent connections per IP
    limit_conn conn_limit 20;

    # Log
    access_log /var/log/nginx/nextjs-access.log;
    error_log  /var/log/nginx/nextjs-error.log;

    client_max_body_size 10M;

    # Static assets Next.js — cache agresif, bypass rate limit
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/common/http.location.proxy-params.conf;

        proxy_cache_valid 200 60d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public folder (favicon, images, dll)
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/common/http.location.proxy-params.conf;

        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Next.js HMR WebSocket (development only — comment di production)
    # location /_next/webpack-hmr {
    #     proxy_pass http://127.0.0.1:3000;
    #     include /etc/nginx/common/http.location.proxy-params.conf;
    # }

    # Semua route SSR / halaman
    location / {
        limit_req zone=req_limit burst=50 nodelay;
        limit_req_status 429;

        include /etc/nginx/common/http.location.proxy-params.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
