# ============================================================
# Limit Zones — include file ini di http{} block nginx
# Lokasi: /etc/nginx/conf.d/limit-zones.conf
# atau include di /etc/nginx/nginx.conf dalam http{}
# ============================================================

# Zone untuk limit concurrent connections per IP
# Dipakai oleh fail2ban jail: nginx-slowloris
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Zone untuk limit request rate per IP — general (semua request)
# Dipakai oleh fail2ban jail: nginx-slowloris
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=30r/s;

# Zone khusus untuk API endpoint — lebih ketat
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
