# ============================================================
# SSL Hardening — include di dalam server{} block (port 443)
# Lokasi: /etc/nginx/common/ssl.conf
# ============================================================

# Hanya izinkan TLS modern
ssl_protocols               TLSv1.2 TLSv1.3;

# Cipher suite yang aman — disable cipher lama
ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers   off;

# Session cache — kurangi overhead TLS handshake
ssl_session_timeout         1d;
ssl_session_cache           shared:SSL:10m;
ssl_session_tickets         off;

# OCSP Stapling
ssl_stapling                on;
ssl_stapling_verify         on;
resolver                    127.0.0.11 valid=300s;
resolver_timeout            5s;

# HSTS — browser wajib pakai HTTPS selama 1 tahun
# Uncomment setelah yakin HTTPS berfungsi dengan benar
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
