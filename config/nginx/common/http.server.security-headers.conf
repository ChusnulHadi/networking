# ============================================================
# Security Headers — include di dalam server{} block
# Lokasi: /etc/nginx/common/security-headers.conf
# ============================================================

# Sembunyikan nginx version dari response header
server_tokens off;

add_header X-Frame-Options           "SAMEORIGIN"                    always;
add_header X-Content-Type-Options    "nosniff"                       always;
add_header X-XSS-Protection          "1; mode=block"                 always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# Timeout untuk anti-slowloris — client harus kirim header dalam 10s
client_header_timeout   10s;
client_body_timeout     10s;
keepalive_timeout       65s;
send_timeout            10s;
